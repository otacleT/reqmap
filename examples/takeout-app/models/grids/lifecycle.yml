# データのライフサイクル網羅グリッド
#
# 列は個人情報を扱うアプリならほぼ共通です。行を案件のデータ種別に書き換えてください。
# 個人情報保護法・GDPR 系の抜けは、ほぼ全部このグリッドで出ます。

id: lifecycle
title: データのライフサイクル
area: A-02

rows:
  # ↓ 案件のデータ種別に書き換える
  - user | アカウント・ユーザー情報 | アカウント,ユーザー情報,会員,退会
  - order | 注文履歴 | 注文履歴,注文,オーダー
  - media | 画像・ファイル | 画像,写真,ファイル
  - consent | 同意記録 | 同意
  - log | ログ | ログ

cols:
  - create | 生成・取得の経路 | 取得,生成,受付
  - store | 保存先と保存形式 | 保存,格納,保持する
  - retain | 保持期間 | 保持期間,有効期限,保存期間
  - soft_delete | 論理削除 | 論理削除,退会
  - hard_delete | 物理削除 | 物理削除,削除手段,完全削除
  - propagate | 外部連携先への削除伝播 | 削除伝播,伝播
  - export | エクスポート・第三者提供 | エクスポート,二次利用,第三者提供,連携

skip: []
