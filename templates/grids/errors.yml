# 異常系の網羅グリッド
#
# **どの案件でも使えます。** 行（操作）だけ案件に合わせて書き換えてください。
# 列は、アプリケーションであればほぼ必ず問われる障害種別です。
#
# 書式は「ID | 表示名 | 題名に出る語（カンマ区切り）」。
# 語は**人が書きます**。機械に分かち書きをさせません。
# 語を書かなければ候補は出ず、そのマスは「真の空白」に落ちます。**安全側に倒すのは意図です。**
#
# skip は「行 x 列 | 理由」。**理由のない skip は書かないでください。**
# 消せば観点として復活します。検討した証跡を残すための欄であって、件数を減らす欄ではありません。

id: errors
title: 異常系（どの操作が、どう壊れたときにどうなるか）
area: A-04

rows:
  # ↓ 案件の主要な操作に書き換える
  - submit | 送信・登録 | 送信,登録,申込
  - upload | ファイル・画像のアップロード | アップロード,画像,ファイル
  - payment | 決済 | 決済,支払,課金
  - external | 外部API呼び出し | 外部API,連携

cols:
  - offline | 通信断・オフライン | 通信断,オフライン,圏外
  - timeout | タイムアウト | タイムアウト,応答なし
  - duplicate | 重複送信（二重タップ・再送） | 重複,二重,再送
  - concurrent | 同時更新（別端末・別タブ） | 同時,競合,排他
  - partial | 一部成功・途中失敗 | 一部成功,途中,部分
  - resume | 中断からの再開 | 再開,中断,復帰
  - idempotent | 冪等性（同じ要求を2回受けたら） | 冪等

