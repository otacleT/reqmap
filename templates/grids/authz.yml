# 認可の網羅グリッド
#
# 「誰が何にアクセスできるか」を1マスずつ。行＝役割、列＝リソース。
# 方針レベル（「所有者検証をします」）で止まりがちな領域なので、
# リソース単位に落として穴を出します。

id: authz
title: 認可（誰が何にアクセスできるか）
area: A-01

rows:
  - anon | 未ログイン | 未ログイン,ログイン前,匿名,ゲスト
  - self | ログイン済み（本人） | 本人,所有者
  - other | ログイン済み（他人のデータ） | 他人,ID推測,所有者検証
  - operator | 運用者・管理者 | 運用者,管理者,管理画面
  - external | 外部連携先 | 外部連携,連携先

cols:
  # ↓ 案件のリソースに書き換える
  - profile | ユーザー情報 | ユーザー情報,プロフィール
  - content | ユーザーが作成したデータ | ← 案件の語に置き換える
  - media | 画像・ファイル | 画像,写真,ファイル
  - config | 設定・マスタ | 設定,マスタ,Config

skip: []
