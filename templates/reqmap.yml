# reqmap — 要件定義ハーネスの設定
#
# ここと models/ を書き換えるだけで、どの案件でも使えます。
# 論点そのもの（questions/）は案件固有、この仕組みは案件非依存。

name: 案件名をここに
milestone: 2026-12-31          # この日までに要件を固める、という目標日。逆算の起点

# ディレクトリ（変える必要はほぼありません）
questions_dir: questions
models_dir: models
out_dir: .reqmap

# 論点1ページあたりの前提の上限。超えると「論点が同居している」として警告します。
# 2 を超えると分割したほうが早く進む、というのが実務上の経験則です。
max_prereqs: 2

# 質問を出してから回答が返るまでの日数。ask_by（いつ出すか）の逆算に使います。
# **実測ではなく仮置きで構いません。** 実績が分かった論点から
# frontmatter の response_days に書き足していけば、そこだけ精度が上がります。
response_days_default: 14
response_days:
  クライアント: 14
  自社: 0

# ID は slug（data.retention-period のような形）。連番ではありません。
#
#   採番の調整が要らない     … 並行して起票してもぶつからない
#   意味が読める             … 「Q-130」は覚えられないが slug は覚えられる
#   分割しても親子が読める   … Q-012 → Q-138/139/140 では関係が分からない
#   複合論点の検出になる     … **slug が付けられない＝論点が同居している**
#
# 相手側の番号（QA表の #12 など）は各ページの `ledger:` に持ちます。
# 内部IDと外部番号は別物です。リネームしたくなったら `aliases:` に旧IDを残せば
# 参照は壊れません。連番の既存 vault からの移行もそのまま読めます。

# 議事録からの引用の最小文字数。照合が守るのは「その一文が原文にある」ことだけなので、
# 「そこは未定です。」のような短い汎用の一文はどんな論点にも付けられてしまう。
# これより短い引用（と、原文に複数回出る引用）は auto にせず人に回します。
quote_min_chars: 12

# fslc verify の探索深さ。models/fsl/*.fsl の検証に使います。fslc が無ければ省略されます。
fsl_depth: 8

# `reqmap ci` が exit 1 にする check（CI で PR を止める用）。既定は「矛盾」と「読めていない」だけ。
# 観点の多さでは止めません。差し替えるならコメントを外して並べてください。
# ci_gate:
#   - fsl.forbidden_accepted
#   - fsl.acceptance_failed
#   - fsl.violated
#   - fsl.seam_broken
#   - fsl.spec_error
#   - fsl.legacy_format
#   - graph.conflict
#   - graph.cycle
#   - rule.duplicate_id

# 決定の本文が書かれる見出し。ここの中身から「決定の指紋」を取ります。
# 決定日ではなく中身から取るのが要点で、
# 「決定日はそのままで結論だけ直す」が実務では普通に起きるためです。
# 指紋が変わると `reqmap changes` に出ます。
decision_heading: 決まったこと

# 本文で依存を書く見出し。Obsidian のグラフビューをそのまま依存グラフとして使えます。
prereq_heading: 前提

# frontmatter の status に日本語を使いたい場合の対応表。
# 正規の値は open / investigating / provisional / decided / dropped の5つ。
status_aliases:
  未決: open
  確認中: investigating
  弊社案: provisional
  仮決定: provisional
  決定: decided
  取下げ: dropped

# 領域。「ID | 名前 | リスク(high/medium/low)」
# リスクは観点の重み付けに使います。全部 high にすると意味がなくなります。
areas:
  - A-01 | 認証・認可 | high
  - A-02 | データと個人情報 | high
  - A-03 | 外部連携 | medium
  - A-04 | 画面と操作フロー | medium
  - A-05 | 非機能（性能・可用性・運用） | medium
